services:
  - type: web
    name: mathlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Free instances have an ephemeral disk; keep SQLite off the app directory.
      - key: MATHLENS_DB
        value: /tmp/mathlens.db
